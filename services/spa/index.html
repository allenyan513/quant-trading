<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SweetValueLab</title>
    <meta name="description" content="The facts layer for AI-native equity research." />
    <!-- Defaults for the homepage. Public routes that want their own identity
         (the /tools/* pages) overwrite title/description/canonical/og on mount —
         a single-document SPA has nowhere else to put per-route metadata. -->
    <link rel="canonical" href="https://sweetvaluelab.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SweetValueLab" />
    <meta property="og:title" content="SweetValueLab" />
    <meta property="og:description" content="The facts layer for AI-native equity research." />
    <meta property="og:url" content="https://sweetvaluelab.com/" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
